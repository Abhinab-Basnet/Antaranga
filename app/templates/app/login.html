<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Antaranga</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; color: white; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login to Antaranga</h2>
        <form method="post">
            {% csrf_token %}
            <p><input type="text" name="username" placeholder="Username" required></p>
            <p><input type="password" name="password" placeholder="Password" required></p>
            <button type="submit">Login</button>
        </form>
        <p>New here? <a href="{% url 'signup' %}" style="color: #38bdf8;">Create an account</a></p>
    </div>
</body>
</html>
