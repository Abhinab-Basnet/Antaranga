<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - Antaranga</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; margin: 0; }
        .signup-box { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; }
        
        
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #0ea5e9; }
        
        h2 { margin-top: 0; text-align: center; }
        p { font-size: 14px; text-align: center; }
        a { text-decoration: none; font-weight: bold; }
        
        
        form p { text-align: left; font-size: 13px; color: #94a3b8; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="signup-box">
        <h2>Join Antaranga</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}" style="color: #38bdf8;">Login here</a></p>
    </div>
</body>
</html>
